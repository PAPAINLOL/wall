# .github/workflows/build-apk.yml
name: Build APK y Release

on:
  push:
    branches:
      - main

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- DIAGNÓSTICO: enséñame qué hay realmente en el repo ---
      - name: Instalar tree
        run: sudo apt-get update -y && sudo apt-get install -y tree

      - name: Árbol completo del repo (sin .git)
        run: tree -a -L 4 -I ".git"

      - name: Listado detallado (por si tree se corta)
        run: find . -not -path "./.git/*" -maxdepth 5 | sort

      - name: Buscar todos los gradlew del repo
        run: find . -iname "gradlew*" -not -path "./.git/*"

      - name: Buscar todos los settings.gradle / build.gradle
        run: find . -iname "*.gradle*" -not -path "./.git/*"

      - name: Mostrar settings.gradle si existe
        run: cat $(find . -iname "settings.gradle*" -not -path "./.git/*" | head -n 1) 2>/dev/null || echo "No se encontró settings.gradle"
      # --- FIN DIAGNÓSTICO ---

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar carpeta con gradlew
        id: locate
        run: |
          GRADLEW_PATH=$(find . -iname "gradlew" -not -path "./.git/*" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "No se encontró gradlew en el repo. Revisa el paso de diagnóstico arriba."
            exit 1
          fi
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          echo "gradlew encontrado en: $GRADLEW_PATH"
          echo "dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Dar permisos a gradlew
        working-directory: ${{ steps.locate.outputs.dir }}
        run: chmod +x ./gradlew

      - name: Build APK (debug)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew assembleDebug

      - name: Localizar el APK generado
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" -path "*debug*" | head -n 1)
          echo "Encontrado: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Generar tag de versión
        id: vars
        run: echo "tag=v$(date +'%Y.%m.%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Crear Release y subir APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Build ${{ steps.vars.outputs.tag }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
